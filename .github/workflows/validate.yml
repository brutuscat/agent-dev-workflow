name: validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate repository
        env:
          VALIDATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          VALIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/validate-repo.sh
          bash scripts/test.sh
